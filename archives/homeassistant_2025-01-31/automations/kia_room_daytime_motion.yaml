- id: kia_daytime_motion 
  alias: Kia Room - Daytime Motion
  trigger:
    - platform: state
      entity_id: binary_sensor.kia_s_room_motion_occupancy
      to: "on"
  condition:
    - condition: time
      after: "08:30:00"
      before: "20:00:00"
  action:
    - service: light.turn_on
      target:
        entity_id: light.kias_light_white
      data:
        brightness_pct: 100
  mode: restart
