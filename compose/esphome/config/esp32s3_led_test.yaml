esphome:
  name: esp32s3_led_test
  friendly_name: ESP32S3 LED Test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

logger:
ota:
  - platform: esphome
api:

light:
  - platform: neopixelbus
    type: GRB
    variant: ws2812
    pin: 2
    num_leds: 69
    name: "Test LED"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT
      inverted: false
    device_class: motion
    name: "Motion"
