version: "3"
services:
  cyhole:
    image: pihole/pihole:2023.10.0
    container_name: cyhole
    environment:
      - TZ=America/Chicago
      - WEBPASSWORD=
      - WEB_PORT=80
    volumes:
      - /home/andy/buzzgate/compose/pihole/etc-pihole:/etc/pihole
      - /home/andy/buzzgate/compose/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    #network_mode:
    #  "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 5
networks:
  compose_cynet:
    external: true 
