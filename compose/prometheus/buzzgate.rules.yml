groups:
  - name: container-alerts
    rules:
      - alert: ContainerDown
        # for: 5m is deliberate, not just "longer is safer": recreating a
        # container (stop+rm+new container, as opposed to a plain restart)
        # leaves its old cgroup metric series permanently frozen in cAdvisor,
        # not just briefly stale. Prometheus's own staleness detection
        # retires that dead series after ~5m; for needs to outlast that so a
        # routine recreate never fires this, while a real outage still does.
        expr: time() - container_last_seen > 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container '{{ $labels.name }}' may be down"
          description: "No recent activity from container '{{ $labels.name }}'."

  - name: system-health
    rules:
      - alert: HighCPUUsage
        expr: glances_cpu_percent > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on Brain"
          description: "CPU usage has exceeded 85% for over 2 minutes."

      - alert: LowDiskSpace
        expr: glances_disk_free_percent < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on Brain"
          description: "Less than 10% disk space remaining."

      - alert: ZombieProcessesDetected
        expr: glances_zombie > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Zombie processes detected"
          description: "Zombie processes are present on Brain."

  - name: smart-home-services
    rules:
      - alert: HomeAssistantDown
        expr: up{job="home-assistant"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Home Assistant is offline"
          description: "Prometheus cannot reach the Home Assistant container."

      # Zigbee2MQTT and Pi-hole don't expose their own Prometheus metrics, and
      # Mosquitto has no scrape job either - standing up dedicated exporters
      # for all three was more than today's hardening pass covered. Instead:
      # - Zigbee2MQTT's bridge connectivity is already surfaced as an HA
      #   entity (binary_sensor.zigbee2mqtt_bridge_connection_state), which
      #   the home-assistant scrape job above picks up for free.
      # - Mosquitto and Pi-hole fall back to the generic ContainerDown rule
      #   below (container name cy-mosquitto-z2m / cyhole). It only catches
      #   the container being down, not the service inside hanging while the
      #   container stays up - a real gap if that ever becomes the failure
      #   mode, but it's what's in place today.
      - alert: Zigbee2MQTTBridgeDown
        expr: hass_binary_sensor_state{entity="binary_sensor.zigbee2mqtt_bridge_connection_state"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Zigbee2MQTT bridge is offline"
          description: "Home Assistant reports the Zigbee2MQTT bridge as disconnected."

  - name: router-health
    rules:
      - alert: RouterUnreachable
        expr: probe_success{job="blackbox-router-icmp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Router is unreachable"
          description: "Blackbox ICMP probe to the router (192.168.1.1) has failed for over 1 minute."

      # Standard IF-MIB (job snmp-router) only sees the SoC's internal
      # uplinks to the switch chip, which always report 1Gb/s regardless of
      # what's plugged into the physical ports - it can't see this. The
      # synology_switch module (job snmp-router-switch) walks Synology's
      # private per-port MIB instead, which is what actually caught port 3
      # running at 100Mb/s. ">0" excludes unplugged ports (they report 0,
      # not a real degraded link).
      - alert: RouterPortSpeedDegraded
        expr: synoPortSpeedMbps{job="snmp-router-switch"} > 0 and synoPortSpeedMbps{job="snmp-router-switch"} < 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Router port {{ $labels.port }} is running below gigabit"
          description: "Physical switch port index {{ $labels.port }} on the router is linked at less than 1000Mb/s."


