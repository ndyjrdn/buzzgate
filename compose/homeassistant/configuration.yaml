
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations
script: !include_dir_merge_list scripts
scene: !include_dir_merge_list scenes
sensor: !include_dir_merge_list sensors
template: !include_dir_merge_list templates
group: !include_dir_merge_named groups
light: !include groups/light_groups.yaml
cover: !include groups/curtain_groups.yaml

lovelace:
  dashboards:
    buzzgate-monitor:
      mode: yaml
      title: Buzzgate Monitor
      icon: mdi:server
      filename: dashboards/buzzgate-monitor.yaml
      show_in_sidebar: true
    curtain-batteries:
      mode: yaml
      title: Curtain Robot Batteries
      icon: mdi:battery
      show_in_sidebar: true
      filename: dashboards/curtain-batteries.yaml
    home-control:
      mode: yaml
      title: Home Control
      icon: mdi:home-automation
      show_in_sidebar: true
      filename: dashboards/control.yaml

input_datetime:
  evening_scene_time:
    name: Evening Scene Time
    has_time: true
    has_date: false

timer:
  bedroom_motion_hold:
    name: Bedroom Motion Hold
    duration: "00:02:00"
  tyler_motion_hold:
    name: Tyler Motion Hold
    duration: "00:02:00"
  master_bedroom_motion_hold:
    name: Master Bedroom Motion Hold
    duration: "00:02:00"

shell_command:
  play_alert: 'aplay /home/pi/alert.wav'

recorder:
  purge_keep_days: 30

history:

logbook:
