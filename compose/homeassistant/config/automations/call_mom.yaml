- id: call_mom
  alias: Call Mom
  description: "Triggered by Kiasbutton MQTT action"
  trigger:
    - platform: state
      entity_id: sensor.kiasbutton_action
      to: "1_single"

  action:
    - service: mqtt.publish
      data:
        topic: zigbee2mqtt/alert_lights/set
        payload: >
          {"state":"ON","color":{"r":255,"g":0,"b":0},"brightness":200}

    - repeat:
        count: 5
        sequence:
          - service: mqtt.publish
            data:
              topic: zigbee2mqtt/alert_lights/set
              payload: >
                {"state":"OFF"}
          - delay: "00:00:01"
          - service: mqtt.publish
            data:
              topic: zigbee2mqtt/alert_lights/set
              payload: >
                {"state":"ON","color":{"r":255,"g":0,"b":0},"brightness":200}
          - delay: "00:00:01"

    - service: mqtt.publish
      data:
        topic: zigbee2mqtt/alert_lights/set
        payload: >
          {"state":"ON","color":{"r":255,"g":0,"b":0},"brightness":200}  # Or restore previous state if tracked

    - service: shell_command.play_alert

    - service: mqtt.publish
       data:
        topic: buzzgate/alert
        payload: "bathroom_call"


  mode: restart
