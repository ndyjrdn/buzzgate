- id: tyler_motion_start
  alias: Tyler Room - Motion Start
  trigger:
    - platform: state
      entity_id: binary_sensor.tylers_room_motion_occupancy
      to: "on"

  action:
    - service: timer.start
      target:
        entity_id: timer.tyler_motion_hold
      data:
        duration: "00:02:00"

    - service: light.turn_on
      target:
        entity_id: light.0x54ef441000d7a808_white #tylers light
      data:
        brightness_pct: 100

  mode: restart
