- id: tyler_daytime_motion 
  alias: Tyler Room - Daytime Motion
  trigger:
    - platform: state
      entity_id: binary_sensor.tylers_room_motion_occupancy
      to: "on"
  condition:
    - condition: time
      after: "08:30:00"
      before: "21:00:00"
  action:
    - service: light.turn_on
      target:
        entity_id: light.tylers_bedroom_white
      data:
        brightness_pct: 100
  mode: restart
