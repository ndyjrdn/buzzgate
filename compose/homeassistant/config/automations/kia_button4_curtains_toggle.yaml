- id: kia_button4_curtains_toggle
  alias: Kia Button4 Curtains Toggle
  trigger:
    - platform: device
      domain: mqtt
      device_id: kia_button4_device_id   # replace with actual device_id
      type: button_short_press           # or whatever event Kia’s button4 sends
      subtype: button_4
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: cover.living_room_curtains
              state: "open"
          sequence:
            - service: cover.close_cover
              target:
                entity_id: cover.living_room_curtains
        - conditions:
            - condition: state
              entity_id: cover.living_room_curtains
              state: "closed"
          sequence:
            - service: cover.open_cover
              target:
                entity_id: cover.living_room_curtains
      default:
        - service: cover.toggle
          target:
            entity_id: cover.living_room_curtains
  mode: single
