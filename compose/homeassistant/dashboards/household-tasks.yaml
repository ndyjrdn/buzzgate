title: Household Tasks
path: household-tasks

button_card_templates:

  task_list:
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - padding: 0
        - margin: 0
        - box-shadow: none
        - border-radius: 0
      custom_fields:
        list:
          - width: 100%
    custom_fields:
      list: |
        [[[
          const person = variables.person;
          const filterEntity = variables.filter;
          const filter = states[filterEntity]?.state || "All";
          const tasks = entity?.attributes?.[person] || [];

          const filtered = tasks.filter(t => {
            if (filter === "All") return true;
            return (t.Frequency || "").toLowerCase() === filter.toLowerCase();
          });

          return `
            <div style="display:flex;flex-direction:column;width:100%;max-width:700px;margin:0 auto;">
              ${filtered.map(t => `
                <div style="
                  display:flex;
                  align-items:center;
                  padding:14px 10px;
                  border-bottom:1px solid var(--divider-color);
                  cursor:pointer;
                "
                onclick="window.hass.callService('rest_command','directus_update_task',{id:'${t.id}', done:${!t.done}})">
                  
                  <ha-icon icon="${t.done ? 'mdi:checkbox-marked' : 'mdi:checkbox-blank-outline'}"
                    style="color:${t.done ? 'var(--primary-color)' : 'var(--secondary-text-color)'};margin-right:14px;font-size:18px;
                                       width:18px;
                                       height:18px;">
                  </ha-icon>

                  <div style="flex:1;">
                    <div style="font-size:16px;${t.done ? 'text-decoration:line-through;opacity:0.6;' : ''}">
                      ${t.title}
                    </div>
                    <div style="font-size:12px;color:var(--secondary-text-color);">
                      ${t.Frequency || ''}
                    </div>
                  </div>

                </div>
              `).join('')}
            </div>
          `;
        ]]]


views:

  # ---------------------------------------------------------
  # HOME VIEW
  # ---------------------------------------------------------
  - title: Home
    path: home
    icon: mdi:home
    cards:

      - type: grid
        square: false
        columns: 2
        cards:

          - type: button
            name: Andy
            icon: mdi:account
            tap_action:
              action: navigate
              navigation_path: /household-tasks/andy
            styles:
              card:
                - height: 140px
                - border-radius: 18px
                - font-size: 20px

          - type: button
            name: Lisa
            icon: mdi:account-female
            tap_action:
              action: navigate
              navigation_path: /household-tasks/lisa
            styles:
              card:
                - height: 140px
