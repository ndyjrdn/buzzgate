- id: master_closet_motion
  alias: Master Closet – Motion Lighting
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.master_closet_motion
      to: "on"
    - platform: state
      entity_id: binary_sensor.master_closet_motion
      to: "off"
      for: "00:00:10"

  action:
    - choose:

        # Motion ON
        - conditions:
            - condition: state
              entity_id: binary_sensor.master_closet_motion
              state: "on"
          sequence:
            - choose:
                # Nighttime dim mode
                - conditions:
                    - condition: time
                      after: "21:00:00"
                      before: "08:00:00"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.master_closet_light
                      data:
                        brightness_pct: 25
              default:
                # Daytime full brightness
                - service: light.turn_on
                  target:
                    entity_id: light.master_closet_light
                  data:
                    brightness_pct: 100

        # Motion OFF for 10 seconds → turn off
        - conditions:
            - condition: state
              entity_id: binary_sensor.master_closet_motion
              state: "off"
              for: "00:00:10"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.master_closet_light
