- id: kitchen_motion_night
  alias: Kitchen – Night Motion Soft Blue
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.kitchen_motion
      to: "on"

  condition:
    - condition: time
      after: "22:00:00"
      before: "06:00:00"

  action:
    # Targets the 4 under-cabinet lights directly instead of the
    # kitchen_under_cabinet group helper: a group's turn_on/turn_off silently
    # no-ops for ALL members if even one member is briefly unavailable.
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_uc_1
          - light.kitchen_uc_3
          - light.kitchen_uc_4
          - light.kitchen_uc_5
      data:
        brightness_pct: 20
        rgb_color: [100, 150, 255]

    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.kitchen_motion
          to: "off"
          for: "00:05:00"

    - service: light.turn_off
      target:
        entity_id:
          - light.kitchen_uc_1
          - light.kitchen_uc_3
          - light.kitchen_uc_4
          - light.kitchen_uc_5
