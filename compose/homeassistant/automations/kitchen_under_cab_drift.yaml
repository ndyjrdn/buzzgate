- id: kitchen_under_cabinet_drift
  alias: Kitchen – Under Cabinet Drift
  mode: restart

  trigger:
    - platform: time
      at: "09:00:00"

  action:
    - variables:
        hue: 0

    - repeat:
        while:
          - condition: time
            before: "22:00:00"
        sequence:
          - service: light.turn_on
            target:
              entity_id: light.kitchen_under_cabinet
            data:
              hs_color: ["{{ hue }}", 80]
              brightness_pct: 40
              transition: 1800

          - delay: "00:30:00"

          - variables:
              hue: "{{ (hue + 1) % 360 }}"
