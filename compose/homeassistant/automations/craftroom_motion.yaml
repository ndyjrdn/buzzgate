- id: craftroom_motion
  alias: CraftRroom – Motion Lighting
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.0xb40e060fffe23838_occupancy
      to: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id:
          - switch.b1_plug
          
    
