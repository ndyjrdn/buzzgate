- id: buzzgate_evening_scene_on
  alias: Buzzgate Evening Scene On
  trigger:
    - platform: sun
      event: sunset
      offset: "0:00:00"

  action:
    # Step 1: Kitchen ceiling on
    # Targets the 5 zone lights directly instead of the kitchen_ceiling_lights
    # group helper: a group's turn_on silently no-ops for ALL members if even
    # one member is briefly unavailable.
    - service: light.turn_on
      target:
        entity_id:
          - light.kitchen_center
          - light.kitchen_ne
          - light.kitchen_nw
          - light.kitchen_se
          - light.kitchen_sw
      data:
        brightness: 225
        color_temp: 75

    # Step 2: Small delay for the effect
    - delay: "00:00:01"

    # Step 3: Living room ceiling on
    - service: light.turn_on
      target:
        entity_id: light.living_room_ceiling
      data:
        brightness: 225
        color_temp: 75

    # Step 4: Apply the scene to finalize all lights + hallway + colors
    - service: scene.turn_on
      target:
        entity_id: scene.buzzgate_evening_on

    # Curtains close as before
    - service: cover.close_cover
      target:
        entity_id: cover.all_curtains

  mode: single
