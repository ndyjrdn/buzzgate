- id: notify_dad_list_new_item
  alias: Notify Andy when Dad list gets a new item
  mode: single

  trigger:
    - platform: event
      event_type: todo.item_added
      event_data:
        entity_id: todo.dad

  action:
    - service: notify.mobile_app_sm_f766u_2
      data:
        message: >
          New task added: {{ trigger.event.data.item.summary }}
