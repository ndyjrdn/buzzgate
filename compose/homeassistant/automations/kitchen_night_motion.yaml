- id: "kitchen_night_motion_soft_blue_01"
  alias: Kitchen Night Motion – Soft Blue
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.0xb40e060fffe23b52_occupancy
      to: "on"

  condition:
    - condition: time
      after: "21:45:00"
      before: "06:00:00"

  action:
    # Turn on soft blue when motion starts
    - service: light.turn_on
      target:
        entity_id:
          - light.0xa4c1380d5a3cd3c1
          - light.0xa4c1380c83af2d32
          - light.0xa4c138cda4d24a98
          - light.0xa4c138d8c12b1f53
          - light.0xa4c1381f17fb1e4d
      data:
        brightness_pct: 20
        rgb_color: [100, 150, 255]

    # Wait until motion stops for 5 minutes
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.0xb40e060fffe23b52_occupancy
          to: "off"
          for: "00:05:00"

    # Turn lights off
    - service: light.turn_off
      target:
        entity_id:
          - light.0xa4c1380d5a3cd3c1
          - light.0xa4c1380c83af2d32
          - light.0xa4c138cda4d24a98
          - light.0xa4c138d8c12b1f53
          - light.0xa4c1381f17fb1e4d

