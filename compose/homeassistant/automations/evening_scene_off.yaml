- id: buzzgate_evening_scene_off
  alias: Buzzgate Evening Scene Off
  trigger:
    - platform: time
      at: "21:30:00"

  action:
    # Step 1: Living room ceiling begins dimming
    - service: light.turn_off
      target:
        entity_id: light.living_room_ceiling
      data:
        transition: 3

    # Step 2: Small delay for the effect
    - delay: "00:00:02"

    # Step 3: Kitchen ceiling begins dimming
    # Targets the 5 zone lights directly instead of the kitchen_ceiling_lights
    # group helper: a group's turn_off silently no-ops for ALL members if even
    # one member is briefly unavailable (e.g. mid Zigbee-mesh disruption).
    - service: light.turn_off
      target:
        entity_id:
          - light.kitchen_center
          - light.kitchen_ne
          - light.kitchen_nw
          - light.kitchen_se
          - light.kitchen_sw
      data:
        transition: 3

    # Step 4: Apply the full evening-off scene with long fade
    - service: scene.turn_on
      data:
        transition: 900   # 15 minutes
      target:
        entity_id: scene.buzzgate_evening_off

    # Step 5: Safety net - the 900s fade should be done by now. Re-assert off
    # in case a device (e.g. a Zigbee end device) missed its command earlier.
    - delay: "00:16:00"
    - service: light.turn_off
      target:
        entity_id:
          - light.hallway_lights
          - light.entryway_lights
          - light.kitchen_center
          - light.kitchen_ne
          - light.kitchen_nw
          - light.kitchen_se
          - light.kitchen_sw
          - light.kitchen_uc_1
          - light.kitchen_uc_2
          - light.kitchen_uc_3
          - light.kitchen_uc_4
          - light.kitchen_uc_5
          - light.dining_room
          - light.living_room_ceiling

  mode: single
