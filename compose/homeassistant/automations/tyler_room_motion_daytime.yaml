- id: tyler_motion_start
  alias: Tyler Room - Motion Start
  trigger:
    - platform: state
      entity_id: binary_sensor.tylers_room_motion_occupancy
      to: "on"

  condition:
    - condition: time
      after: "09:00:00"
      before: "23:00:00"

  action:
    - service: timer.start
      target:
        entity_id: timer.tyler_motion_hold
      data:
        duration: "00:02:00"

    - service: light.turn_on
      target:
        entity_id: light.tylers_light_white #tyler's light
      data:
        brightness_pct: 45

  mode: restart
