- id: kitchen_lux_control
  alias: Kitchen Lux Control
  description: "On when natural light drops below 200 lx, off when above 350 lx. Runs from sunrise to 20 min before sunset (sundown automation takes over)."
  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: sensor.kitchen_lumos_illuminance

  condition:
    - condition: sun
      after: sunrise
      before: sunset
      before_offset: "-00:20:00"

  action:
    - variables:
        lux: "{{ states('sensor.kitchen_lumos_illuminance') | float(0) }}"

    - choose:
        # Too dark — turn both kitchen lights on
        - conditions: "{{ lux < 200 }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.kitchen_ceiling_lights
              data:
                brightness_pct: 80
                color_temp: 250
            - service: light.turn_on
              target:
                entity_id: light.kitchen_under_cabinet
              data:
                brightness_pct: 40
                color_temp: 300

        # Bright enough — turn both off
        - conditions: "{{ lux > 350 }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id:
                  - light.kitchen_ceiling_lights
                  - light.kitchen_under_cabinet
