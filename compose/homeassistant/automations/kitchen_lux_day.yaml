- id: kitchen_lux_control
  alias: Kitchen Lux Control
  description: "On when natural light drops below 200 lx, off when above 350 lx. Runs from sunrise to 20 min before sunset (sundown automation takes over)."
  mode: single
  max_exceeded: silent

  # numeric_state triggers only fire when CROSSING the threshold, not on every
  # sensor update - the old bare `state` trigger fired on every lux
  # fluctuation (this sensor updates every few seconds), spamming light
  # commands and Zigbee traffic dozens of times a minute.
  trigger:
    - platform: numeric_state
      entity_id: sensor.kitchen_lumos_illuminance
      below: 200
      id: dark
    - platform: numeric_state
      entity_id: sensor.kitchen_lumos_illuminance
      above: 350
      id: bright

  condition:
    - condition: sun
      after: sunrise
      before: sunset
      before_offset: "-00:20:00"

  action:
    - choose:
        # Too dark — turn kitchen lights on. Targets zone/under-cabinet
        # lights directly instead of the group helpers: a group's turn_on
        # silently no-ops for ALL members if even one member is unavailable.
        - conditions: "{{ trigger.id == 'dark' }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id:
                  - light.kitchen_center
                  - light.kitchen_ne
                  - light.kitchen_nw
                  - light.kitchen_se
                  - light.kitchen_sw
              data:
                brightness_pct: 80
                color_temp: 250
            - service: light.turn_on
              target:
                entity_id:
                  - light.kitchen_uc_1
                  - light.kitchen_uc_2
                  - light.kitchen_uc_3
                  - light.kitchen_uc_4
                  - light.kitchen_uc_5
              data:
                brightness_pct: 40
                color_temp: 300

        # Bright enough — turn both off
        - conditions: "{{ trigger.id == 'bright' }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id:
                  - light.kitchen_center
                  - light.kitchen_ne
                  - light.kitchen_nw
                  - light.kitchen_se
                  - light.kitchen_sw
                  - light.kitchen_uc_1
                  - light.kitchen_uc_2
                  - light.kitchen_uc_3
                  - light.kitchen_uc_4
                  - light.kitchen_uc_5
