- id: kitchen_lux_control
  alias: Kitchen Lux Control (Daytime)
  mode: restart

  trigger:
    - platform: state
      entity_id: sensor.luminance_kitchen

  condition:
    - condition: time
      after: "09:00:00"
      before: "16:45:00"

  action:
    - variables:
        lux: "{{ states('sensor.luminance_kitchen') | float }}"
        low: 150
        medium: 180
        high: 210

    - choose:
        # Too dark → turn ON and set brightness lower
        - conditions: "{{ lux < low }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.kitchen
              data:
                brightness_pct: >
                  {{ [((low - lux) * 0.6) | int, 100] | min }}

        # Between low and medium → adjust brightness proportionally
        - conditions: "{{ lux >= low and lux <= medium }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.kitchen
              data:
                brightness_pct: >
                  {{ [((lux - low) / (medium - low)) * 100, 100] | min }}

        # Between medium and high → maintain current state
        - conditions: "{{ lux >= medium and lux < high }}"
          sequence: []

        # Too bright → turn OFF
        - conditions: "{{ lux > high }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.kitchen
