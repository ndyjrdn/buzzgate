- id: master_bedroom_motion
  alias: Master Bedroom – Motion Lighting
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.master_motion
      to: "on"
  action:
    - choose:
        # Daytime (09:00–19:30)
        - conditions:
            - condition: time
              after: "09:00:00"
              before: "19:30:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.master_ceiling_white
              data:
                brightness_pct: 100        # standardized from brightness: 255
                color_temp: 250
            - service: timer.start
              target:
                entity_id: timer.master_bedroom_motion_hold
              data:
                duration: "00:02:00"

        # Nighttime (19:30–midnight)
        - conditions:
            - condition: time
              after: "19:30:00"
              before: "23:59:59"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.master_ceiling_rgb
              data:
                brightness_pct: 50
                rgb_color: [128, 0, 255]
            - service: timer.start
              target:
                entity_id: timer.master_bedroom_motion_hold
              data:
                duration: "00:02:00"

      # Default: late night / early morning (midnight–09:00)
      default:
        - service: light.turn_on
          target:
            entity_id: light.master_ceiling_rgb
          data:
            brightness_pct: 10             # very dim, won't destroy night vision
            rgb_color: [255, 60, 0]        # warm amber — adjust to taste
        - service: timer.start
          target:
            entity_id: timer.master_bedroom_motion_hold
          data:
            duration: "00:02:00"

- id: master_bedroom_motion_timeout
  alias: Master Bedroom – Motion Timeout
  mode: restart                            # added for safety
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.master_bedroom_motion_hold
  condition:
    - condition: state
      entity_id: binary_sensor.master_motion
      state: "off"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.master_ceiling_white
          - light.master_ceiling_rgb
