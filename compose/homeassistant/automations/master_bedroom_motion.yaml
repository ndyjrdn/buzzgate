- id: master_bedroom_motion
  alias: Master Bedroom – Motion Lighting
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.master_motion
      to: "on"

  action:
    - choose:

        # Daytime (09:00–19:30)
        - conditions:
            - condition: time
              after: "09:00:00"
              before: "19:30:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.master_ceiling_white
              data:
                brightness: 255
                color_temp: 250
            - service: timer.start
              target:
                entity_id: timer.master_bedroom_motion_hold
              data:
                duration: "00:02:00"

        # Nighttime (after 19:30)
        - conditions:
            - condition: time
              after: "19:30:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.master_ceiling_rgb
              data:
                brightness_pct: 50
                rgb_color: [128, 0, 255]
            - service: timer.start
              target:
                entity_id: timer.master_bedroom_motion_hold
              data:
                duration: "00:02:00"
