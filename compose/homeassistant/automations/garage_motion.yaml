- id: garage_motion
  alias: Garage – Motion Lighting
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.garage_motion
      to: "on"

  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.garage_light1
          - light.garage_light2

    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.garage_motion
          to: "off"
      timeout: "00:30:00"

    - service: light.turn_off
      target:
        entity_id:
          - light.garage_light1
          - light.garage_light2
