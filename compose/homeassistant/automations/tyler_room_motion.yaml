- id: tyler_motion_start
  alias: Tyler Room – Motion Start
  trigger:
    - platform: state
      entity_id: binary_sensor.tyler_motion
      to: "on"

  condition:
    - condition: time
      after: "09:00:00"
      before: "23:00:00"

  action:
    - service: timer.start
      target:
        entity_id: timer.tyler_motion_hold
      data:
        duration: "00:02:00"

    - service: light.turn_on
      target:
        entity_id: light.tyler_ceiling_white
      data:
        brightness_pct: 45

  mode: restart
  
- id: tyler_motion_timeout
  alias: Tyler Room – Motion Timeout
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.tyler_motion_hold

  condition:
    - condition: state
      entity_id: binary_sensor.tyler_motion
      state: "off"

  action:
    - service: light.turn_off
      target:
        entity_id: light.tyler_ceiling_white
