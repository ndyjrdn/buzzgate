- id: kia_motion_off
  alias: Kia Room - Auto Off After Motion Clears
  trigger:
    - platform: state
      entity_id: binary_sensor.kias_motion_occupancy
      to: "off"
      for: "00:03:00"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.kias_bedroom_white
          - light.kias_bedroom_rgb
  mode: restart
