- id: buzzgate_morning_scene_off
  alias: Buzzgate Morning Scene Off
  trigger:
    - platform: time
      at: "09:00:00"
  action:
    - service: scene.turn_on
      target:
        entity_id: scene.buzzgate_morning_off
    - service: cover.open_cover
      target:
        entity_id: cover.living_room_curtains
        entity_id: cover.deck_door_curtains
  mode: single
