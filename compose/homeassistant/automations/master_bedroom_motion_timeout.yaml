- id: master_bedroom_motion_timeout
  alias: Master Bedroom – Motion Timeout
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.master_bedroom_motion_hold

  condition:
    - condition: state
      entity_id: binary_sensor.master_motion
      state: "off"

  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.master_ceiling_white
          - light.master_ceiling_rgb
