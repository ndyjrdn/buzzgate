- id: send_dad_list_to_directus
  alias: "Sync Dad List to Directus"
  mode: queued

  trigger:
    - platform: state
      entity_id: todo.dad
      attribute: items

  action:
    - variables:
        last_item: "{{ trigger.to_state.attributes.items[-1] }}"
        item_title: "{{ last_item.summary }}"
        item_id: "{{ last_item.uid }}"

    - service: rest_command.directus_create_task
      data:
        title: "{{ item_title }}"
        external_id: "{{ item_id }}"
        list_id: "1"


