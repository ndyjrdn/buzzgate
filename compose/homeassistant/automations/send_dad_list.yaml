- id: send_dad_list_to_directus
  alias: "Sync Dad List to Directus"
  mode: queued

  trigger:
    - platform: state
      entity_id: todo.dad

  action:
    - variables:
        item_title: "{{ trigger.to_state.attributes.items[-1].summary }}"
        item_id: "{{ trigger.to_state.attributes.items[-1].uid }}"

    - service: rest_command.directus_create_task
      data:
        title: "{{ item_title }}"
        external_id: "{{ item_id }}"
        list_id: "1"

