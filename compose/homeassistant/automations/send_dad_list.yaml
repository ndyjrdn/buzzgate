- id: send_dad_list_to_directus
  alias: "Sync Dad List to Directus"
  mode: queued

  trigger:
    - platform: state
      entity_id: todo.dad

  action:
    - service: todo.get_items
      data:
        entity_id: todo.dad
      response_variable: dad_items

    - variables:
        last_item: "{{ dad_items.items[-1] }}"
        item_title: "{{ last_item.summary }}"
        item_id: "{{ last_item.uid }}"

    - service: rest_command.directus_create_task
      data:
        title: "{{ item_title }}"
        external_id: "{{ item_id }}"
        list_id: "1"



