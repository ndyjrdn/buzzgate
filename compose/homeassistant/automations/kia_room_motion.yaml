- id: kia_room_motion
  alias: Kia Room – Motion Lighting
  mode: restart

  trigger:
    - platform: state
      entity_id: binary_sensor.kia_motion
      to: "on"

  action:
    - choose:

        # Daytime
        - conditions:
            - condition: time
              after: "08:30:00"
              before: "20:00:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.kia_ceiling_white
              data:
                brightness_pct: 100

        # Nighttime
        - conditions:
            - condition: time
              after: "20:00:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.kia_ceiling_rgb
              data:
                brightness_pct: 50
                rgb_color: [128, 0, 255]

    # Auto-off logic: lights stay on until the room has been
    # clear of motion for 20 minutes. Any new motion restarts
    # this automation (mode: restart), resetting the 20 minutes.
    # The outer timeout is just a safety net in case the sensor
    # gets stuck reporting "on".
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.kia_motion
          to: "off"
          for: "00:20:00"
      timeout: "01:00:00"

    - service: light.turn_off
      target:
        entity_id:
          - light.kia_ceiling_white
          - light.kia_ceiling_rgb
