- id: send_dad_list_to_directus
  alias: "Send Dad List Item to Directus"
  trigger:
    - platform: event
      event_type: call_service
      event_data:
        domain: todo
        service: add_item
  condition:
    - condition: template
      value_template: >
        {{ 'todo.dad' in trigger.event.data.service_data.entity_id }}
  action:
    - service: rest_command.directus_task
      data:
        title: "{{ trigger.event.data.service_data.item }}"


