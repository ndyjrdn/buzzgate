  - platform: rest
    name: directus_tasks_andy
    resource: !secret directus_url/items/Tasks?filter[assigned_to][_eq]=Admin
    method: GET
    headers:
      Authorization: !secret directus_token
    value_template: "{{ value_json.data | length }}"
    json_attributes_path: "$.data"
    json_attributes:
      - id
      - title
      - description
      - assigned_to
      - Frequency
      - done

