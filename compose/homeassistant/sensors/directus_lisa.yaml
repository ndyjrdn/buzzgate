- platform: rest
    name: directus_tasks_lisa
    resource: !secret directus_url_lisa
    method: GET
    headers:
      Authorization: !secret directus_token
    value_template: "{{ value_json.data | length }}"
    json_attributes_path: "$.data"
    json_attributes:
      - id
      - title
      - description
      - assigned_to
      - Frequency
      - done
