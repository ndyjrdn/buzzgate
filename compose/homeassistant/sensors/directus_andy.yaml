- platform: rest
  name: directus_tasks_andy
  resource: !secret directus_url_andy
  method: GET
  headers:
    Authorization: !secret directus_token
  value_template: "{{ value_json.data.items | length }}"
  json_attributes_path: "$.data.items"
  json_attributes:
    - id
    - title
    - description
    - Frequency
    - done
    - assigned_to
