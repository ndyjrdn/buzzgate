- platform: rest
  name: directus_tasks_andy
  resource: !secret directus_url_andy
  method: GET
  headers:
    Authorization: !secret directus_token
    Content-Type: application/json
    Accept: application/json
  content_type: application/json
  value_template: "{{ value_json.data | length }}"
  json_attributes_path: "$"
  json_attributes:
    - data
  scan_interval: 30

