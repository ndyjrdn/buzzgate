global:
  resolve_timeout: 5m

route:
  receiver: 'pushover-notifications'
  # receiver: 'email-alerts'
  # group_by: ['alertname']
  # group_wait: 10s
  # group_interval: 30s
  # repeat_interval: 1h

receivers:
  # - name: 'email-alerts'
  #   email_configs:
  #     - to: 'ndyjrdn@gmail.com'
  #       from: 'ndyjrdn@gmail.com'
  #       smarthost: 'smtp.gmail.com:587'
  #       auth_username: 'ndyjrdn@gmail.com'
  #       auth_password: 'REDACTED_GMAIL_APP_PW'
  #       require_tls: true
  - name: 'pushover-notifications'
    pushover_configs:
      - user_key_file: /etc/alertmanager/pushover_user_key
        token_file: /etc/alertmanager/pushover_token
        title: '{{ .CommonLabels.alertname }}'
        message: '{{ .CommonAnnotations.summary }}'
        # Alertmanager's own default (unset priority) is 2 = Emergency, which
        # re-rings every 1m for up to 1h until acknowledged - too aggressive
        # for anything short of "the whole house is dark". critical -> 1
        # (High: gets attention, bypasses quiet hours, sends once). Anything
        # else (e.g. warning) -> 0 (Normal, quiet). Resolved notices -> 0.
        priority: '{{ if eq .Status "resolved" }}0{{ else if eq .CommonLabels.severity "critical" }}1{{ else }}0{{ end }}'
