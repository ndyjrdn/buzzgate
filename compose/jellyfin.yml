version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.5
    container_name: jellyfin
    ports:
      - "8096:8096"  # HTTP access
      # - "8920:8920"  # Uncomment for HTTPS if using reverse proxy
    volumes:
      - /volume1/JellyfinConfig:/config
      - /volume1/JellyfinCache:/cache

      # Canonical media mounts
      - /volume1/media1/movies:/media/movies
      - /volume1/media1/extras:/media/extras

      # SSD or secondary media mount (unchanged)
      - /mnt/jellyfin/media2:/media/media2

    environment:
      - TZ=America/Chicago
      - PUID=1026
      - PGID=100
    restart: unless-stopped

