services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - compose_cynet

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - /home/andy/buzzgate/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/andy/buzzgate/compose/prometheus/buzzgate.rules.yml:/etc/prometheus/buzzgate.rules.yml
      - /home/andy/buzzgate/compose/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - /home/andy/buzzgate/compose/prometheus/.ha_token:/etc/prometheus/ha_token:ro
      - prometheus_data:/prometheus
    networks:
      - compose_cynet
      
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8180:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - compose_cynet

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - compose_cynet

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    ports:
      - "61208:61208"
    command: glances -w
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - compose_cynet
      
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    volumes:
      - /home/andy/buzzgate/compose/snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    networks:
      - compose_cynet

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "9115:9115"
    volumes:
      - /home/andy/buzzgate/compose/blackbox_exporter/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - compose_cynet

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - /home/andy/buzzgate/compose/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /home/andy/buzzgate/compose/alertmanager/.pushover_user_key:/etc/alertmanager/pushover_user_key:ro
      - /home/andy/buzzgate/compose/alertmanager/.pushover_token:/etc/alertmanager/pushover_token:ro
    restart: unless-stopped
    networks:
      - compose_cynet


volumes:
  prometheus_data:
  grafana_data:
networks:
  compose_cynet:
    external: true
