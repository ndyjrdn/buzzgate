version: "3.8"

services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    ports:
      - "8090:8080"
    environment:
      NC_DB: "sqlite"
      NC_PUBLIC_URL: "https://tasks.yourdomain.com"
      NC_AUTH_JWT_SECRET: "HpBM5oG9RsMSdVeS"
    volumes:
      - ./nc_data:/usr/app/data
    restart: unless-stopped
    networks:
      - compose_cynet

networks:
  compose_cynet:
    external: true
