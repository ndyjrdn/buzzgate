version: "3"

services:
  nextcloud:
    image: nextcloud:stable
    container_name: cycloud
    ports:
      - "8081:80"
    volumes:
      - /home/andy/buzzgate/compose/nextcloud/html:/var/www/html
      #- /mnt/skippy-share:/var/www/html/data
      - /home/andy/nextcloud-data:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=andy
      - MYSQL_HOST=mariadb
    networks:
      - compose_cynet
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: cycloud-db
    environment:
      - MYSQL_ROOT_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=andy
      - MYSQL_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
    volumes:
      - /home/andy/buzzgate/compose/nextcloud/db:/var/lib/mysql
    networks:
      - compose_cynet
    restart: unless-stopped

networks:
  compose_cynet:
    external: true
