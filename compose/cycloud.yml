version: "3"

services:
  nextcloud:
    image: nextcloud:32
    container_name: cycloud
    ports:
      - "8081:80"
    volumes:
      - /mnt/cycloud-share/nextcloud/config:/var/www/html/config
      - /mnt/cycloud-share/nextcloud/data:/var/www/html/data
      - /mnt/photos:/mnt/photos:ro
    environment:
      - MYSQL_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=andy
      - MYSQL_HOST=mariadb
    networks:
      - compose_cynet
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: cycloud-db
    environment:
      - MYSQL_ROOT_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=andy
      - MYSQL_PASSWORD=REDACTED_NEXTCLOUD_DB_PW
    volumes:
      - /home/andy/buzzgate/compose/nextcloud/db:/var/lib/mysql
    networks:
      - compose_cynet
    restart: unless-stopped

networks:
  compose_cynet:
    external: true
